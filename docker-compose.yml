# ================================
# docker-compose.yml
# ================================

version: '3.8'

services:
  # Application web
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=mysql+pymysql://creative_user:creative_password@db/creative_cocktail
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=your-super-secret-key-change-in-production
    depends_on:
      - db
      - redis
    volumes:
      - ./app/static/uploads:/app/app/static/uploads
    restart: unless-stopped

  # Base de données MariaDB
  db:
    image: mariadb:10.9
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=creative_cocktail
      - MYSQL_USER=creative_user
      - MYSQL_PASSWORD=creative_password
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    restart: unless-stopped

  # Redis pour cache et Celery
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Worker Celery pour les tâches en arrière-plan
  worker:
    build: .
    command: celery -A run.celery worker --loglevel=info
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=mysql+pymysql://creative_user:creative_password@db/creative_cocktail
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=your-super-secret-key-change-in-production
    depends_on:
      - db
      - redis
    restart: unless-stopped

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
      - ./app/static:/var/www/static
    depends_on:
      - web
    restart: unless-stopped

volumes:
  mariadb_data:
